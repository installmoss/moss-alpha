<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MOSS — Quiet Alpha</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #050505;
      color: #4ade80;
      font-family: 'JetBrains Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px 16px;
      overflow-x: hidden;
    }

    .logo {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      margin-bottom: 18px;
      border: 2px solid #1f1f1f;
      box-shadow: 0 0 30px rgba(74, 222, 128, 0.15);
      opacity: 0;
      animation: fadeIn 1s ease forwards;
    }

    .title {
      font-size: 2.6rem;
      letter-spacing: 10px;
      color: #86efac;
      text-shadow: 0 0 25px rgba(74, 222, 128, 0.35);
      opacity: 0;
      animation: fadeIn 1s ease 0.2s forwards;
    }

    .subtitle {
      color: #4ade80;
      opacity: 0.6;
      margin-top: 6px;
      margin-bottom: 32px;
      font-size: 0.95rem;
      opacity: 0;
      animation: fadeIn 1s ease 0.4s forwards;
    }

    .terminal {
      width: 100%;
      max-width: 720px;
      background: #0c0c0c;
      border: 1px solid #1a1a1a;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 40px rgba(74, 222, 128, 0.06);
      opacity: 0;
      animation: fadeIn 1s ease 0.5s forwards;
    }

    .terminal-bar {
      background: #141414;
      padding: 11px 16px;
      display: flex;
      align-items: center;
      gap: 7px;
      border-bottom: 1px solid #1f1f1f;
    }

    .dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
    }
    .red { background: #ff5f56; }
    .yellow { background: #ffbd2e; }
    .green { background: #27c93f; }

    .bar-title {
      margin-left: 10px;
      font-size: 0.8rem;
      color: #555;
    }

    .terminal-body {
      padding: 22px 20px;
      height: 420px;
      overflow-y: auto;
      font-size: 0.9rem;
      line-height: 1.7;
    }

    .line {
      margin-bottom: 8px;
      opacity: 0;
      transform: translateY(10px);
      animation: slideUp 0.45s ease forwards;
    }

    .prompt { color: #86efac; }
    .cmd { color: #e2e8f0; }
    .out { color: #4ade80; opacity: 0.85; padding-left: 14px; }
    .sys { color: #64748b; font-style: italic; }

    .cursor {
      display: inline-block;
      width: 8px;
      height: 15px;
      background: #4ade80;
      margin-left: 3px;
      animation: blink 1s step-end infinite;
      vertical-align: middle;
    }

    .links {
      margin-top: 36px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      opacity: 0;
      animation: fadeIn 1s ease 1.2s forwards;
    }

    .links a {
      color: #4ade80;
      text-decoration: none;
      border: 1px solid #1f1f1f;
      padding: 9px 16px;
      border-radius: 8px;
      font-size: 0.85rem;
      transition: all 0.25s ease;
    }

    .links a:hover {
      background: #111;
      border-color: #4ade80;
      box-shadow: 0 0 18px rgba(74, 222, 128, 0.12);
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    @keyframes slideUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    .terminal-body::-webkit-scrollbar {
      width: 5px;
    }
    .terminal-body::-webkit-scrollbar-track {
      background: transparent;
    }
    .terminal-body::-webkit-scrollbar-thumb {
      background: #222;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <img class="logo" src="https://pbs.twimg.com/profile_images/2108567229445054465/oYHIIHgR_400x400.jpg" alt="Moss Logo">
  
  <div class="title">MOSS</div>
  <div class="subtitle">Quiet alpha discovery skill</div>

  <div class="terminal">
    <div class="terminal-bar">
      <div class="dot red"></div>
      <div class="dot yellow"></div>
      <div class="dot green"></div>
      <div class="bar-title">moss@bankr — skill</div>
    </div>
    <div class="terminal-body" id="term"></div>
  </div>

  <div class="links">
    <a href="https://github.com/installmoss/moss-alpha" target="_blank">GitHub</a>
    <a href="https://x.com/installingMOSS" target="_blank">X / Twitter</a>
    <a href="https://bankr.bot/terminal/trade?out=0xe2e9a281e3762cf10354416653a69eb044d93ba3&chain=base" target="_blank">$MOSS Token</a>
    <a href="https://github.com/installmoss/moss-alpha/blob/main/SKILL.md" target="_blank">Skill</a>
  </div>

  <script>
    const term = document.getElementById('term');

    const sequence = [
      { type: 'sys',  text: '// initializing moss-alpha v2...' },
      { type: 'cmd',  text: 'status' },
      { type: 'out',  text: 'Skill: online' },
      { type: 'out',  text: 'Mode: quiet discovery' },
      { type: 'out',  text: 'Noise filter: active' },
      { type: 'blank' },
      { type: 'cmd',  text: 'scan --quiet' },
      { type: 'out',  text: 'Looking for overlooked opportunities...' },
      { type: 'out',  text: '→ low social volume detected' },
      { type: 'out',  text: '→ steady holder growth' },
      { type: 'out',  text: '→ healthy structure found' },
      { type: 'blank' },
      { type: 'cmd',  text: 'token' },
      { type: 'out',  text: '$MOSS is live on Base' },
      { type: 'out',  text: 'Contract: 0xe2e9a281...d93ba3' },
      { type: 'out',  text: 'Holders get deeper analysis' },
      { type: 'blank' },
      { type: 'cmd',  text: 'philosophy' },
      { type: 'out',  text: 'Moss doesn’t rush.' },
      { type: 'out',  text: 'It grows quietly.' },
      { type: 'blank' },
      { type: 'cmd',  text: 'install' },
      { type: 'out',  text: 'install the skill from https://github.com/installmoss/moss-alpha' },
      { type: 'blank' },
      { type: 'sys',  text: '// waiting for next quiet signal...' },
      { type: 'cursor' }
    ];

    let delay = 400;

    sequence.forEach((item) => {
      setTimeout(() => {
        const div = document.createElement('div');
        div.className = 'line';

        if (item.type === 'blank') {
          div.innerHTML = '&nbsp;';
        } 
        else if (item.type === 'sys') {
          div.innerHTML = `<span class="sys">${item.text}</span>`;
        } 
        else if (item.type === 'cmd') {
          div.innerHTML = `<span class="prompt">moss@bankr:\~$ </span><span class="cmd">${item.text}</span>`;
        } 
        else if (item.type === 'out') {
          div.innerHTML = `<span class="out">${item.text}</span>`;
        } 
        else if (item.type === 'cursor') {
          div.innerHTML = `<span class="prompt">moss@bankr:\~$ </span><span class="cursor"></span>`;
        }

        term.appendChild(div);
        term.scrollTop = term.scrollHeight;
      }, delay);

      delay += item.type === 'blank' ? 280 : 650;
    });
  </script>
</body>
</html>
